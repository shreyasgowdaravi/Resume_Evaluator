name: Build and deploy Python app to Azure Web App - TalentWiz

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # Native libs for packages like pycairo, mysqlclient, lxml, Pillow, etc.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config python3-dev \
            libcairo2 libcairo2-dev \
            libjpeg-dev zlib1g-dev \
            libxml2-dev libxslt1-dev \
            default-libmysqlclient-dev

      # Optional: sanity-check that your wheels build on Ubuntu
      - name: Validate Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -v -r requirements.txt
        env:
          PIP_NO_BINARY: ":none:"   # force building wheels; remove if not needed

      # Deploy straight from the checked-out workspace (NO ARTIFACTS)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TalentWiz'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E37DEE61E09C41AE9DD5A78BAC8ED7FC }}
