<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing - TalentWize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="%23e2e8f0" stroke-width="0.5" opacity="0.3"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
    }
    
    .loading-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.1);
      padding: 3.5rem;
      max-width: 550px;
      margin: 0 auto;
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }
    
    .loading-icon {
      width: 80px;
      height: 80px;
      background: var(--primary-gradient);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: spin 1s linear infinite;
    }
    

    
    .gear-icon {
      font-size: 2rem;
      color: white;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .progress-modern {
      height: 8px;
      border-radius: 4px;
      background: #e2e8f0;
      overflow: hidden;
      margin: 1.5rem 0;
    }
    
    .progress-bar-modern {
      background: var(--primary-gradient);
      height: 100%;
      border-radius: 4px;
      width: 70%;
      animation: progress-pulse 2s ease-in-out infinite;
    }
    
    @keyframes progress-pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    

    
    .status-text {
      color: #64748b;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    

    
    .tips-section {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 16px;
      padding: 2rem;
      margin-top: 2.5rem;
      border-left: 4px solid #667eea;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    
    .tip-item {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #475569;
    }
    
    .tip-icon {
      color: #667eea;
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center p-4">
    <div class="loading-container">
      <div class="text-center">
        <div class="loading-icon">
          <i class="bi bi-cpu gear-icon"></i>
        </div>
        
        <h4 class="mb-2 fw-bold text-dark">Processing...</h4>
        <p class="status-text" id="statusText">Analyzing resumes...</p>
        
        <div class="progress-modern">
          <div class="progress-bar-modern"></div>
        </div>
        

        
        <!-- Tips Section -->
        <div class="text-center mt-3">
          <p class="text-muted small">Processing your files with AI...</p>
        </div>
        
        <div class="mt-4">
          <small class="text-muted">
            <i class="bi bi-shield-check me-1"></i>
            Your data is processed securely and confidentially
          </small>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const messages = ['Analyzing resumes...', 'Processing with AI...', 'Almost done...'];
    let index = 0;
    
    setInterval(() => {
      document.getElementById('statusText').textContent = messages[index];
      index = (index + 1) % messages.length;
    }, 2000);
  </script>
</body>
</html>
