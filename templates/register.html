<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account - TalentWiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"/>

  <style>
    /* exactly the same style as your login page */
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="%23ffffff" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23dots)"/></svg>');
    }

    .login-card {
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1);
      border: none;
      border-radius: 24px;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.95);
      position: relative;
      z-index: 1;
    }
    .brand-logo {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%; display:flex; align-items:center; justify-content:center;
      margin: 0 auto 1.5rem; box-shadow: 0 10px 25px rgba(102,126,234,0.3);
      position: relative; overflow:hidden;
    }
    .brand-logo::before {
      content:""; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer { 0%{transform:translateX(-100%) translateY(-100%) rotate(45deg);} 100%{transform:translateX(100%) translateY(100%) rotate(45deg);} }

    .form-control { border-color:#e2e8f0; border-radius:12px; padding:0.875rem 1rem; font-size:1rem; transition: all .3s; }
    .form-control:focus { border-color:#667eea; box-shadow: 0 0 0 .25rem rgba(102,126,234,0.15); transform: translateY(-1px); }

    .btn-login { background: linear-gradient(135deg,#667eea,#764ba2); border:none; border-radius:12px; padding:1rem 2rem; font-weight:600; font-size:1.1rem; color:white; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.4); }

    .form-label { font-weight:600; color:#374151; margin-bottom:.75rem; }

    .btn-back {
      border: 2px solid #764ba2; border-radius: 12px; background: transparent; color: #764ba2;
      margin-top: 1rem; width: 100%; display:inline-flex; justify-content:center; align-items:center;
    }
    .btn-back:hover { background:#764ba2; color:white; }

    .alert { border-radius:12px; border:none; backdrop-filter: blur(10px); }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5 col-lg-4">
        <div class="card login-card">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div class="brand-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Company Logo" style="width:60px; height:60px; object-fit:contain" />
              </div>
              <h3 class="fw-bold text-dark">Create New Account</h3>
              <p class="text-muted">Fill in your details to sign up</p>
            </div>

            <!-- flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- IMPORTANT: action points to register route -->
            <form method="POST" action="{{ url_for('register') }}">
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold"><i class="bi bi-person"></i> Full Name</label>
                <input type="text" name="name" id="name" class="form-control form-control-lg" placeholder="Enter your full name" required />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold"><i class="bi bi-envelope"></i> Email</label>
                <input type="email" name="email" id="email" class="form-control form-control-lg" placeholder="Enter your email" required />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold"><i class="bi bi-lock"></i> Password</label>
                <input type="password" name="password" id="password" class="form-control form-control-lg" placeholder="Enter password" required />
              </div>

              <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold"><i class="bi bi-lock-fill"></i> Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control form-control-lg" placeholder="Confirm password" required />
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-login btn-lg"><i class="bi bi-person-check"></i> Create Account</button>
              </div>

              <button type="button" class="btn-back" onclick="window.location.href='{{ url_for('login') }}'">
                <i class="bi bi-arrow-left"></i> Back to Login
              </button>
            </form>

            <div class="text-center mt-4">
              <small class="text-muted"><i class="bi bi-shield-check"></i> Your data is secure</small>
              <div class="mt-2">
                <small class="text-muted" style="font-size: 0.75rem;">
                  © 2025. All rights reserved.
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
