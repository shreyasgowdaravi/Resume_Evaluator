<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login - TalentWize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
      overflow-x: hidden;
      color: #374151;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url(
        'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="%23ffffff" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23dots)"/></svg>'
      );
      z-index: 0;
    }
    .login-card {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 24px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
      position: relative;
      z-index: 1;
    }
    h3 {
      font-weight: 700;
      color: #1f2937;
    }
    .form-label {
      font-weight: 600;
      color: #374151;
    }
    .form-control {
      border-color: #e2e8f0;
      border-radius: 12px;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.15);
      transform: translateY(-1px);
    }
    .btn-login {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      padding: 1rem 2rem;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      color: white;
      width: 100%;
    }
    .btn-login::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: left 0.5s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #5a6fd8, #6a42a0);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    .btn-login:hover::before {
      left: 100%;
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-back-user {
      margin-top: 1rem;
      background: transparent;
      border: 2px solid #764ba2;
      border-radius: 12px;
      padding: 0.875rem 2rem;
      font-weight: 600;
      font-size: 1.1rem;
      color: #764ba2;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-back-user:hover {
      background: #764ba2;
      color: white;
    }
    .brand-logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      position: relative;
      overflow: hidden;
    }
    .brand-logo::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }
    .input-group-text {
      border-color: #e2e8f0;
      background: #f8fafc;
      border-radius: 12px 0 0 12px;
    }
    .alert {
      border-radius: 12px;
      border: none;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5 col-lg-4">
        <div class="card login-card">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div class="brand-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Company Logo" style="width: 60px; height: 60px; object-fit: contain;">
              </div>
              <h3 class="fw-bold text-dark">TalentWize</h3>
              <p class="text-muted">Administrator Access</p>
              <p class="small text-warning"><i class="bi bi-shield-lock"></i> Admin Login</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'danger' else 'info' }} alert-dismissible fade show" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            <form method="POST" id="adminLoginForm">
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">
                  <i class="bi bi-envelope"></i> Admin Email
                </label>
                <input type="email" name="email" id="email" class="form-control form-control-lg" placeholder="Enter admin email" required />
              </div>
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                  <i class="bi bi-lock"></i> Admin Password
                </label>
                <div class="input-group">
                  <input type="password" name="password" id="password" class="form-control form-control-lg" placeholder="Enter admin password" required />
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-login btn-lg text-white" id="adminLoginBtn">
                  <i class="bi bi-shield-check"></i> Admin Sign In
                </button>
              </div>
            </form>
            <button type="button" class="btn-back-user" onclick="window.location.href='/'">
              <i class="bi bi-arrow-left-circle me-2"></i> Back to User Login
            </button>
            
            <div class="text-center mt-4">
              <small class="text-muted">
                <i class="bi bi-shield-check"></i> Secure admin access
              </small>
              <div class="mt-2">
                <small class="text-muted" style="font-size: 0.75rem;">
                  © 2025. All rights reserved.
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const password = document.getElementById('password');
      const icon = this.querySelector('i');
      if (password.type === 'password') {
        password.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        password.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });
    
    document.getElementById('adminLoginForm').addEventListener('submit', function() {
      const btn = document.getElementById('adminLoginBtn');
      btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Signing In...';
      btn.disabled = true;
    });
  </script>
</body>
</html>
